# Optional: expose the Relay node at a hostname with TLS terminated at the
# cluster edge. Edit the host and TLS secret for your cluster (or annotate
# the Ingress for cert-manager), then:
#
#   kubectl apply -f https://raw.githubusercontent.com/mansus-org/relay/main/deploy/ingress.yaml
#
# Because Relay uses path-based addressing, one host and one certificate is
# enough for every site on the node — no wildcard host is required.
#
# The live stream (/api/stream) needs nothing here. ingress-nginx buffers
# responses unless the backend tells it not to, and Relay sends
# `X-Accel-Buffering: no` on every stream; and it closes a connection that has
# sent nothing for proxy-read-timeout (60s by default), which the 30s stream
# keepalive stays under. Shorten STREAM_KEEPALIVE_SECONDS if you lower that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  namespace: relay
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - relay.example.com
      secretName: relay-tls
  rules:
    - host: relay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relay
                port:
                  name: http
