# Deploys relay.mansus.org via the k3s app platform
# (docs: nemoNoboru/k3s-hetzner-gitops docs/app-platform/).

# image: ghcr.io/mansus-org/relay (chart default for release "relay").
# One image: FastAPI backend serving the API under /api and the Expo web build at /.

port: 8000

ingress:
  host: relay.mansus.org

# The existing relay-data disk (mounted at /data, holds the SQLite database).
persistence:
  enabled: true
  size: 10Gi

healthCheck:
  path: /api/health

# SECRET_KEY signs the access tokens. The API refuses to start while it is still the development
# default published in this repo (backend/src/relay/shared/config.py), so it has to come from the
# cluster. Every key in the secret below becomes an env var.
#
# PENDING: these are placeholders, not ciphertext. Sealing needs the cluster's sealed-secrets
# controller certificate, which needs kubectl. Until a person replaces both blocks with real
# sealed values, the preview cannot start and merging this takes relay.mansus.org down: no
# SECRET_KEY, so the guard fires. How-to: k3s-hetzner-gitops docs/app-platform/new-app.md #6.
#
# To fill both at once, with kubectl on the k3s cluster: .k3s/seal-secret-key.sh
#
# Production, sealed for the "relay" namespace:
#   kubectl create secret generic relay-secrets -n relay \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name sealed-secrets-controller --controller-namespace kube-system \
#       --format yaml | yq '.spec.encryptedData'
sealedSecrets:
  - name: relay-secrets
    encryptedData:
      SECRET_KEY: REPLACE-ME-SEALED-FOR-THE-RELAY-NAMESPACE

# Previews run in relay-pr-N and cannot decrypt the block above, so they get their own copy,
# sealed --scope cluster-wide with a throwaway key (docs/app-platform/previews.md).
#   kubectl create secret generic relay-secrets -n placeholder \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-name sealed-secrets-controller --controller-namespace kube-system \
#       --scope cluster-wide --format yaml | yq '.spec.encryptedData'
preview:
  sealedSecrets:
    - name: relay-secrets
      scope: cluster-wide
      encryptedData:
        SECRET_KEY: REPLACE-ME-SEALED-FOR-ANY-NAMESPACE

envFromSecrets: [relay-secrets]

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: "1", memory: 512Mi }

# Image user is "relay" (uid 100, gid 101, as in the old Go image: the local-path disk is owned by it and ignores fsGroup).
podSecurityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101 }
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }
terminationGracePeriodSeconds: 45
